# Deploy to the staging server once CI has passed on a push to main: build the
# site (static files, the game inside at /play) and the game server, upload
# them, switch the server to them, then smoke-test the site, Nakama and an
# online match from outside.
#
# No long-lived deploy credential. This workflow's GitHub OIDC token becomes a
# short-lived token of a GCP deploy service account (Workload Identity
# Federation). The VM uses OS Login: the service account adds a 10-minute SSH
# key to its own OS Login profile, reaches SSH through IAP, and acts on the
# stack only as DEPLOY_USER, who owns it (rootless Podman). The VM's host key
# is pinned. (Not metadata SSH keys: the guest agent's key sync on this VM
# stalls on users it can't deprovision.)
#
# Repository settings it needs:
#   variables: SITE_DOMAIN, API_DOMAIN, DEPLOY_HOST_KEY (the VM's /etc/ssh/ssh_host_ed25519_key.pub)
#   secrets:   NAKAMA_CLIENT_KEY (Nakama's --socket.server_key, the same as the server's deploy/.env: built into
#              the bundles and sent by every browser, so not secret; a secret keeps it out of logs),
#              GCP_WIF_PROVIDER (projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>),
#              GCP_DEPLOY_SA (the service account's email), GCP_PROJECT_ID, DEPLOY_VM, DEPLOY_ZONE and
#              DEPLOY_USER (the stack's owner on the VM): not secret either, but this repository's logs are public
# GCP: the provider accepts only this repository's .github/workflows/deploy.yml@refs/heads/main;
# the service account has compute.viewer and iap.tunnelResourceAccessor on the project,
# compute.osLogin (no sudo) on the VM and iam.serviceAccountUser on the VM's service account;
# the VM has enable-oslogin=TRUE, a firewall rule lets 35.235.240.0/20 (IAP) reach tcp:22, and
# /etc/sudoers.d/scrapyard-deploy lets the service account's login (sa_<uniqueId>) run commands as DEPLOY_USER only.
# The server holds ~/scrapyard/deploy/.env (deploy/.env.example).
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

concurrency: deploy-staging

jobs:
  deploy:
    # A workflow_run job has secrets whatever triggered ci, and `branches`
    # matches a fork's pull request from a branch the fork named main. Only a
    # push to main in this repository is trusted: its code went through main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout, main's tip
      id-token: write # the OIDC token for Workload Identity Federation
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # the commit CI passed, not main's tip: a newer commit may not have passed yet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            game/package-lock.json
            www/package-lock.json

      # Nakama's address and client key go into both bundles at build time
      - name: Build
        env:
          SITE_URL: https://${{ vars.SITE_DOMAIN }}
          VITE_NAKAMA_HOST: ${{ vars.API_DOMAIN }}
          VITE_NAKAMA_PORT: 443
          VITE_NAKAMA_SSL: true
          VITE_NAKAMA_KEY: ${{ secrets.NAKAMA_CLIENT_KEY }}
          PUBLIC_NAKAMA_HOST: ${{ vars.API_DOMAIN }}
          PUBLIC_NAKAMA_PORT: 443
          PUBLIC_NAKAMA_SSL: true
          PUBLIC_NAKAMA_KEY: ${{ secrets.NAKAMA_CLIENT_KEY }}
        run: |
          (cd game && npm ci)
          (cd www && npm ci)
          scripts/build.sh

      # after the build: the credentials file auth writes must stay out of it
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          # given, not derived from the service account: the logs mask a secret's value, not one derived from it
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Roll the server
        env:
          GH_TOKEN: ${{ github.token }}
          VM: ${{ secrets.DEPLOY_VM }}
          ZONE: ${{ secrets.DEPLOY_ZONE }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          # CI runs can finish out of order. Once main has moved on, that commit's
          # own deploy rolls the server; rolling this one after it would go back in time.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::Not rolled: main is at $tip now"
            exit 0
          fi

          # A key for this run only, in the service account's OS Login profile for 10 minutes
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/deploy
          gcloud compute os-login ssh-keys add --key-file ~/.ssh/deploy.pub --ttl 10m > /dev/null
          login=$(gcloud compute os-login describe-profile --format 'value(posixAccounts[0].username)')

          # The host key is pinned under the alias gcloud gives the VM: nothing is trusted on first use.
          id=$(gcloud compute instances describe "$VM" --zone "$ZONE" --format 'value(id)')
          echo "compute.$id $HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $VM
            User $login
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            HostKeyAlias compute.$id
            StrictHostKeyChecking yes
            ProxyCommand gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone $ZONE --verbosity warning
          EOF

          # The stack belongs to DEPLOY_USER; the login may run commands as that user only (sudoers on the VM).
          # The first login retries while the new key reaches OS Login.
          # shellcheck disable=SC2029 # DEPLOY_USER is expanded here on purpose
          for _ in 1 2 3 4 5; do passwd=$(ssh vm getent passwd "$DEPLOY_USER") && break; sleep 5; done
          IFS=: read -r _ _ uid _ _ home _ <<<"$passwd"
          [ -n "$home" ] || { echo "::error::No login to $VM as $login, or no user $DEPLOY_USER there"; exit 1; }
          owner="sudo -iu $DEPLOY_USER env XDG_RUNTIME_DIR=/run/user/$uid"

          # -c: compare contents, not mtimes (a fresh checkout's are all new), so only real changes are listed
          send() { rsync -rlpcz --itemize-changes --rsync-path "sudo -u $DEPLOY_USER rsync" "$@"; }
          changes=$(send --relative deploy/compose.yml deploy/Caddyfile nakama/data scripts/deploy.sh scripts/backup.sh "vm:$home/scrapyard/")
          echo "$changes"
          # the site: only what changed travels; deploy.sh snapshots it as release $SHA
          send --delete --mkpath www/dist/ "vm:$home/scrapyard/site/incoming/"
          # the game server: the bundle main.js runs (and replay.js, the replays' runner), without the capacity tool
          server=$(send --delete --mkpath --exclude load.js game/dist-server/ "vm:$home/scrapyard/server/incoming/")
          echo "$server"
          # Only the site is switched; Nakama restarts (dropping live matches) only when a file it
          # reads changed on the server, the game server (dropping online matches) only when its
          # bundle did, everything when the compose file or the Caddyfile did
          # (a file sent to a remote host is itemized <f, one copied locally >f)
          flags=
          if grep -q '^[<>]f.* nakama/' <<<"$changes"; then flags="$flags --nakama"; fi
          if grep -q '^[<>]f' <<<"$server"; then flags="$flags --server"; fi
          if grep -qE '^[<>]f.* deploy/(compose\.yml|Caddyfile)$' <<<"$changes"; then flags="$flags --all"; fi
          # shellcheck disable=SC2029 # expanded here on purpose
          ssh vm "$owner scrapyard/scripts/deploy.sh $SHA$flags"

      - name: Smoke test
        env:
          SITE: https://${{ vars.SITE_DOMAIN }}
          SITE_URL: https://${{ vars.SITE_DOMAIN }}
          NAKAMA_URL: https://${{ vars.API_DOMAIN }}
          NAKAMA_CLIENT_KEY: ${{ secrets.NAKAMA_CLIENT_KEY }}
        run: |
          # retries wait out the restarts
          get() { curl -fsS --retry 10 --retry-all-errors --retry-delay 3 -o /dev/null "$1"; }
          get "$SITE/"
          get "$SITE/docs/modes"
          get "$SITE/play"
          get "$NAKAMA_URL/healthcheck"
          node scripts/nakama-smoke.mjs
          node scripts/chat-smoke.mjs # the match chat's rules (nakama/data/modules/chat.lua)
          get "$SITE/api/stats" # Caddy reaches Nakama with the HTTP key
          # a guest takes a seat in an online match at /match (the game server behind Caddy); a few tries while it restarts
          for try in 1 2 3 4 5; do node scripts/match-smoke.mjs && break; [ "$try" = 5 ] && exit 1; sleep 5; done
