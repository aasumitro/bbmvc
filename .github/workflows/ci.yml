# Checks for every pull request and every push to main: the game and the site.
name: ci
on:
  pull_request:
  push:
    branches: [main]

# pull requests from forks run untrusted code: the token only reads
permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # the build tools and the tests run .ts files
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build # tsc -b, then vite build
      - run: npm test # every test: the unit project, then the integration one (vitest.config.ts)

  www:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build # typechecks too
